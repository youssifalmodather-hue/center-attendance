<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); } </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8">
        <div class="text-center mb-8">
            <div class="bg-gradient-to-br from-blue-500 to-blue-700 w-20 h-20 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            </div>
            <h1 class="text-3xl font-extrabold text-gray-800">نظام السنتر</h1>
            <p class="text-gray-500 mt-2">سجل دخولك لإدارة سنترك</p>
        </div>
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">البريد الإلكتروني</label>
                <input type="email" id="email" required class="w-full bg-gray-50 border-2 border-gray-200 rounded-xl p-3.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">كلمة المرور</label>
                <input type="password" id="password" required class="w-full bg-gray-50 border-2 border-gray-200 rounded-xl p-3.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-blue-600 to-blue-800 hover:from-blue-700 hover:to-blue-900 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-blue-500/40">دخول</button>
        </form>
        <div class="mt-6 text-center border-t pt-4">
            <a href="register.html" class="text-blue-600 font-bold text-sm hover:underline">إنشاء حساب جديد</a>
        </div>
        <div id="msg" class="mt-4 text-center text-red-600 font-bold hidden bg-red-50 p-3 rounded-xl"></div>
    </div>
    <script>
        const SUPABASE_URL = 'https://rhvqwqlceskxfmimycff.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_NMH3fk1qPBypFpji_aryxA_WTfePxTL';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('msg');
            btn.innerText = 'جاري الدخول...'; btn.disabled = true;
            const { error } = await supabaseClient.auth.signInWithPassword({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            });
            if (error) {
                msg.innerText = 'خطأ: ' + error.message; msg.classList.remove('hidden');
                btn.innerText = 'دخول'; btn.disabled = false;
            } else { window.location.href = 'index.html'; }
        });
    </script>
</body>
</html>
