<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المجموعات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; background-color: #f3f4f6; padding-bottom: 85px; } </style>
</head>
<body class="min-h-screen p-4">
    <div class="max-w-4xl mx-auto mt-4">
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-sm">
            <div>
                <h1 class="text-2xl font-extrabold text-gray-800">المجموعات</h1>
                <p class="text-gray-500 text-sm">إدارة الطلاب حسب المجموعة</p>
            </div>
            <button onclick="showAddGroup()" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold text-sm shadow-lg">+ مجموعة</button>
        </div>

        <!-- Form Add Group (Hidden) -->
        <div id="addGroupForm" class="hidden bg-white p-4 rounded-2xl shadow-sm mb-6">
            <input type="text" id="newGroupName" placeholder="اسم المجموعة الجديدة" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 mb-3">
            <div class="flex gap-2">
                <button onclick="addGroup()" class="flex-1 bg-green-600 text-white py-2 rounded-xl font-bold">حفظ</button>
                <button onclick="hideAddGroup()" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-xl font-bold">إلغاء</button>
            </div>
        </div>

        <div id="groupsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg z-50">
        <div class="max-w-md mx-auto flex justify-around">
            <a href="index.html" class="flex flex-col items-center py-3 text-gray-500 hover:text-blue-600">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-xs">الرئيسية</span>
            </a>
            <a href="scan.html" class="flex flex-col items-center py-3 text-gray-500 hover:text-blue-600">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
                <span class="text-xs">المسح</span>
            </a>
            <a href="groups.html" class="flex flex-col items-center py-3 text-blue-600 font-bold">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span class="text-xs">المجموعات</span>
            </a>
        </div>
    </nav>

    <script>
        const SUPABASE_URL = 'https://rhvqwqlceskxfmimycff.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_NMH3fk1qPBypFpji_aryxA_WTfePxTL';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (!session) window.location.href = 'login.html';
            else loadGroups();
        });

        function showAddGroup() { document.getElementById('addGroupForm').classList.remove('hidden'); }
        function hideAddGroup() { document.getElementById('addGroupForm').classList.add('hidden'); }

        async function addGroup() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const name = document.getElementById('newGroupName').value;
            if (!name) return alert('اسم المجموعة مطلوب');
            
            const { error } = await supabaseClient.from('groups').insert({ name, user_id: session.user.id });
            if (error) return alert('خطأ: ' + error.message);
            
            document.getElementById('newGroupName').value = '';
            hideAddGroup();
            loadGroups();
        }

        async function loadGroups() {
            const { data: groups, error } = await supabaseClient.from('groups').select('*, students(count)');
            const container = document.getElementById('groupsContainer');
            
            if (error || !groups || groups.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center text-gray-500 py-10">لا توجد مجموعات مضافة.</div>`;
                return;
            }

            container.innerHTML = groups.map(g => `
                <a href="group-details.html?id=${g.id}" class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 hover:shadow-md transition-shadow flex justify-between items-center">
                    <div>
                        <h3 class="text-xl font-bold text-gray-800">${g.name}</h3>
                        <p class="text-gray-500 text-sm mt-1">${g.students[0]?.count || 0} طالب</p>
                    </div>
                    <div class="bg-purple-100 p-2 rounded-full text-purple-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                </a>
            `).join('');
        }
    </script>
</body>
</html>
