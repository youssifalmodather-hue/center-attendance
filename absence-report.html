<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقرير الغياب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; background-color: #f3f4f6; padding-bottom: 85px; } </style>
</head>
<body class="min-h-screen p-4">
    <div class="max-w-4xl mx-auto mt-4">
        <div class="bg-white p-4 rounded-2xl shadow-sm mb-6">
            <h1 class="text-2xl font-extrabold text-gray-800">تقرير الغياب</h1>
            <p class="text-gray-500 text-sm">عدد مرات غياب كل طالب وإرسال إشعارات</p>
        </div>

        <div class="bg-white rounded-3xl shadow-lg overflow-hidden">
            <div class="p-0 overflow-x-auto">
                <table class="w-full text-right text-sm text-gray-600">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-50">
                        <tr>
                            <th class="px-4 py-4">الطالب</th>
                            <th class="px-4 py-4">المجموعة</th>
                            <th class="px-4 py-4">مرات الغياب</th>
                            <th class="px-4 py-4 text-center">إشعار</th>
                        </tr>
                    </thead>
                    <tbody id="absenceList"><tr><td colspan="4" class="text-center py-6 text-gray-400">جاري التحميل...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg z-50">
        <div class="max-w-md mx-auto flex justify-around">
            <a href="index.html" class="flex flex-col items-center py-3 text-gray-500 hover:text-blue-600">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-xs">الرئيسية</span>
            </a>
            <a href="scan.html" class="flex flex-col items-center py-3 text-gray-500 hover:text-blue-600">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
                <span class="text-xs">المسح</span>
            </a>
            <a href="groups.html" class="flex flex-col items-center py-3 text-blue-600 font-bold">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span class="text-xs">المجموعات</span>
            </a>
        </div>
    </nav>

    <script>
        const SUPABASE_URL = 'https://rhvqwqlceskxfmimycff.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_NMH3fk1qPBypFpji_aryxA_WTfePxTL';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (!session) window.location.href = 'login.html';
            else loadAbsenceReport();
        });

        async function loadAbsenceReport() {
            // بنجيب الطلاب وعدد سجلات الحضور بتاعتهم
            const { data: students } = await supabaseClient.from('students').select(`id, name, parent_phone, groups(name), attendance_log(id)`).order('name');
            const tbody = document.getElementById('absenceList');
            
            if (!students || students.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-gray-500">لا يوجد طلاب</td></tr>`;
                return;
            }

            tbody.innerHTML = students.map(s => {
                // بنفترض إن عدد الحصص الكلي 8 (ممكن تطورها بعدين تجيبها من الباقة)
                const attended = s.attendance_log?.length || 0;
                const absences = Math.max(0, 8 - attended); // افتراض بسيط لحساب الغياب
                
                const absColor = absences >= 3 ? 'text-red-600 bg-red-50' : 'text-green-600 bg-green-50';
                const phone = s.parent_phone?.replace(/\D/g, '') || '';
                const waText = encodeURIComponent(`عزيزي ولي الأمر،\nنود إعلامكم بأن الطالب: ${s.name}\nقد تغيب عن ${absences} حصص.\nنرجو المتابعة.`);
                const waBtn = phone ? `<a href="https://wa.me/${phone}?text=${waText}" target="_blank" class="bg-[#25D366] text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.885-9.885 9.885m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L0 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg> واتساب</a>` : '';

                return `<tr class="border-b hover:bg-gray-50">
                    <td class="px-4 py-4 font-bold text-gray-800">${s.name}</td>
                    <td class="px-4 py-4 text-gray-500">${s.groups?.name || 'بدون'}</td>
                    <td class="px-4 py-4"><span class="${absColor} px-2 py-1 rounded font-bold">${absences} غياب</span></td>
                    <td class="px-4 py-4 text-center">${waBtn}</td>
                </tr>`;
            }).join('');
        }
    </script>
</body>
</html>
