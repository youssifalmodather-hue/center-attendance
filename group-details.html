<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المجموعة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; background-color: #f3f4f6; padding-bottom: 85px; } </style>
</head>
<body class="min-h-screen p-4">
    <div class="max-w-4xl mx-auto mt-4">
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-sm">
            <div>
                <a href="groups.html" class="text-blue-600 text-sm mb-1 flex items-center gap-1 font-semibold">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    العودة للمجموعات
                </a>
                <h1 id="groupTitle" class="text-2xl font-extrabold text-gray-800">جاري التحميل...</h1>
            </div>
            <a href="all-students.html" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold text-sm shadow-lg">+ طالب</a>
        </div>

        <div class="bg-white rounded-3xl shadow-lg overflow-hidden">
            <div class="p-0 overflow-x-auto">
                <table class="w-full text-right text-sm text-gray-600">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-50">
                        <tr><th class="px-4 py-4">اسم الطالب</th><th class="px-4 py-4">رقم الواتساب</th><th class="px-4 py-4 text-center">الإجراءات</th></tr>
                    </thead>
                    <tbody id="studentsList"><tr><td colspan="3" class="text-center py-6 text-gray-400">جاري التحميل...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <nav id="bottomNav" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg z-50 transition-transform duration-300">
        <div class="max-w-md mx-auto flex justify-around">
            <!-- زرار إخفاء/إظهار الشريط (ثابت في مكانه) -->
<button onclick="toggleNav()" id="toggleNavBtn" class="fixed bottom-[80px] left-4 bg-gray-800 text-white p-2 rounded-full shadow-lg z-50 transition-all duration-300">
    <svg id="toggleIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <!-- سهم لتحت (عشان يخفي) -->
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
    </svg>
</button>
            <a href="index.html" class="flex flex-col items-center py-3 text-gray-500 hover:text-blue-600">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-xs">الرئيسية</span>
            </a>
            <a href="scan.html" class="flex flex-col items-center py-3 text-gray-500 hover:text-blue-600">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
                <span class="text-xs">المسح</span>
            </a>
            <a href="groups.html" class="flex flex-col items-center py-3 text-blue-600 font-bold">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span class="text-xs">المجموعات</span>
            </a>
        </div>
    </nav>

    <script>
        const SUPABASE_URL = 'https://rhvqwqlceskxfmimycff.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_NMH3fk1qPBypFpji_aryxA_WTfePxTL';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (!session) window.location.href = 'login.html';
            else loadGroupDetails();
        });

        async function loadGroupDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const groupId = urlParams.get('id');
            if (!groupId) return window.location.href = 'groups.html';

            const { data: group } = await supabaseClient.from('groups').select('name').eq('id', groupId).single();
            document.getElementById('groupTitle').innerText = group ? group.name : 'مجموعة غير معروفة';

            const { data: students } = await supabaseClient.from('students').select('*').eq('group_id', groupId);
            const tbody = document.getElementById('studentsList');
            
            if (!students || students.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center py-6 text-gray-500">لا يوجد طلاب في هذه المجموعة</td></tr>`;
                return;
            }

            tbody.innerHTML = students.map(s => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="px-4 py-4 font-bold text-blue-600 hover:underline cursor-pointer" onclick="window.location.href='student-report.html?id=${s.id}'">${s.name}</td>
                    <td class="px-4 py-4 text-gray-500 dir-ltr text-right text-xs">${s.parent_phone || 'غير مسجل'}</td>
                    <td class="px-4 py-4 flex justify-center gap-2">
                        <a href="register-student.html?id=${s.id}" class="p-2 bg-yellow-50 text-yellow-600 rounded-lg" title="تعديل">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        </a>
                        <button onclick="deleteStudent(${s.id}, '${s.name}')" class="p-2 bg-red-50 text-red-600 rounded-lg" title="مسح">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        async function deleteStudent(id, name) {
            if (!confirm(`هل أنت متأكد من مسح الطالب: ${name}؟ سيتم مسح كل بياناته.`)) return;
            const { error } = await supabaseClient.from('students').delete().eq('id', id);
            if (error) return alert('خطأ: ' + error.message);
            loadGroupDetails();
        }
                function toggleNav() {
            const nav = document.getElementById('bottomNav');
            const icon = document.getElementById('toggleIcon');

            if (nav.style.transform === 'translateY(100%)') {
                // إظهار الشريط
                nav.style.transform = 'translateY(0)';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>'; // سهم لتحت
            } else {
                // إخفاء الشريط
                nav.style.transform = 'translateY(100%)';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>'; // سهم لفوق
            }
        }
    </script>
</body>
</html>
