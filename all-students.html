<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كل الطلاب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; background-color: #f3f4f6; padding-bottom: 85px; } </style>
</head>
<body class="min-h-screen p-4">
    <div class="max-w-5xl mx-auto mt-4">
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-sm">
            <div>
                <h1 class="text-2xl font-extrabold text-gray-800">كل الطلاب</h1>
                <p class="text-gray-500 text-sm">عرض وإدارة بيانات جميع الطلاب</p>
            </div>
            <a href="register-student.html" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold text-sm">+ طالب</a>
        </div>

        <div class="mb-4">
            <input type="text" id="searchInput" placeholder="ابحث بالاسم أو كود QR..." class="w-full bg-white border border-gray-200 rounded-xl p-3 shadow-sm focus:ring-2 focus:ring-blue-500" oninput="filterStudents()">
        </div>

        <div class="bg-white rounded-3xl shadow-lg overflow-hidden">
            <div class="p-0 overflow-x-auto">
                <table class="w-full text-right text-sm text-gray-600">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-50">
                        <tr>
                            <th class="px-4 py-4">اسم الطالب</th>
                            <th class="px-4 py-4">كود QR</th>
                            <th class="px-4 py-4">المجموعة</th>
                            <th class="px-4 py-4 text-center">التفاصيل</th>
                        </tr>
                    </thead>
                    <tbody id="studentsList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <nav id="bottomNav" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg z-50 transition-transform duration-300">
        <div class="max-w-md mx-auto flex justify-around">
            <!-- زرار إخفاء/إظهار الشريط (ثابت في مكانه) -->
<button onclick="toggleNav()" id="toggleNavBtn" class="fixed bottom-[80px] left-4 bg-gray-800 text-white p-2 rounded-full shadow-lg z-50 transition-all duration-300">
    <svg id="toggleIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <!-- سهم لتحت (عشان يخفي) -->
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
    </svg>
</button>
             <a href="index.html" class="flex flex-col items-center py-3 text-gray-500 hover:text-blue-600">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-xs">الرئيسية</span>
            </a>
            <a href="all-students.html" class="flex flex-col items-center py-3 text-blue-600 font-bold">
                 <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <span class="text-xs">كل الطلاب</span>
            </a>
        </div>
    </nav>

    <script>
        const SUPABASE_URL = 'https://rhvqwqlceskxfmimycff.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_NMH3fk1qPBypFpji_aryxA_WTfePxTL';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let allStudents = [];

        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (!session) window.location.href = 'login.html';
            else loadStudents();
        });

        async function loadStudents() {
            const { data: students } = await supabaseClient.from('students').select(`id, name, qr_code, groups(name)`).order('name');
            allStudents = students || [];
            renderStudents(allStudents);
        }

        function renderStudents(students) {
            const tbody = document.getElementById('studentsList');
            if (students.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-gray-500">لا يوجد طلاب</td></tr>`;
                return;
            }
            tbody.innerHTML = students.map(s => `
                <tr class="border-b hover:bg-gray-50 cursor-pointer" onclick="window.location.href='student-report.html?id=${s.id}'">
                    <td class="px-4 py-4 font-bold text-gray-800">${s.name}</td>
                    <td class="px-4 py-4 text-gray-500 font-mono text-xs">${s.qr_code}</td>
                    <td class="px-4 py-4 text-gray-600">${s.groups?.name || 'بدون'}</td>
                    <td class="px-4 py-4 text-center">
                        <span class="text-blue-600 bg-blue-50 px-2 py-1 rounded text-xs font-bold">عرض</span>
                    </td>
                </tr>
            `).join('');
        }

        function filterStudents() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allStudents.filter(s => 
                s.name.toLowerCase().includes(q) || 
                s.qr_code.toLowerCase().includes(q)
            );
            renderStudents(filtered);
        }
                function toggleNav() {
            const nav = document.getElementById('bottomNav');
            const icon = document.getElementById('toggleIcon');

            if (nav.style.transform === 'translateY(100%)') {
                // إظهار الشريط
                nav.style.transform = 'translateY(0)';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>'; // سهم لتحت
            } else {
                // إخفاء الشريط
                nav.style.transform = 'translateY(100%)';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>'; // سهم لفوق
            }
        }
    </script>
</body>
</html>
