<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حضور السنتر</title>
    
    <!-- إعدادات PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a73e8">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1949/1949051.png">

    <!-- مكتبة قراءة الباركود -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <!-- مكتبة Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-bottom: 20px; }
        
        /* منطقة المسح */
        #reader { width: 100%; border-radius: 8px; overflow: hidden; border: 2px solid #1a73e8; margin-bottom: 20px; }
        
        /* شاشة النتيجة */
        #result { margin-top: 20px; }
        .success-box { background: #e8f5e9; border: 1px solid #4caf50; padding: 15px; border-radius: 8px; color: #2e7d32; }
        .error-box { background: #ffebee; border: 1px solid #f44336; padding: 15px; border-radius: 8px; color: #c62828; }
        .info-row { display: flex; justify-content: space-between; margin: 10px 0; font-size: 16px; border-bottom: 1px dashed #ccc; padding-bottom: 5px; }
        
        /* زر الواتساب */
        .whatsapp-btn { display: block; width: 100%; margin-top: 15px; padding: 12px; background: #25D366; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 16px; }
        .whatsapp-btn:active { background: #1ebe57; }
    </style>
</head>
<body>

    <div class="container">
        <h2>مسح كود الطالب</h2>
        <div id="reader"></div>
        <div id="result">جاري تهيئة الكاميرا...</div>
    </div>

    <script>
        // ==========================================
        // 1. إعدادات Supabase (غيرهم ببياناتك)
        // ==========================================
        const SUPABASE_URL = 'https://rhvqwqlceskxfmimycff.supabase.co'; // مثلا: https://xyz.supabase.co
        const SUPABASE_KEY = 'sb_publishable_NMH3fk1qPBypFpji_aryxA_WTfePxTL'; // المفتاح الطويل
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ==========================================
        // 2. تهيئة الماسح الضوئي
        // ==========================================
        const resultDiv = document.getElementById('result');
        
        function onScanSuccess(decodedText, decodedResult) {
            // إيقاف الكاميرا مؤقتاً لمنع المسح المتكرر
            html5QrcodeScanner.pause(true);
            resultDiv.innerHTML = `<div style="color:#1a73e8;">جاري التحقق من الكود: ${decodedText}...</div>`;

            // استدعاء دالة Supabase
            processAttendance(decodedText);
        }

        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { fps: 10, qrbox: {width: 250, height: 250} },
            /* verbose= */ false
        );
        html5QrcodeScanner.render(onScanSuccess);

        // ==========================================
        // 3. معالجة الحضور عبر Supabase
        // ==========================================
        async function processAttendance(qrCode) {
            try {
                // استدعاء دالة الـ RPC اللي عملناها في المرحلة 4
                const { data, error } = await supabaseClient.rpc('scan_attendance', {
                    p_qr: qrCode
                });

                if (error) throw new Error("خطأ في الاتصال بالسيرفر: " + error.message);

                if (data.status === 'ok') {
                    showSuccess(data, qrCode);
                } else {
                    showError(data.message);
                }

            } catch (err) {
                showError(err.message);
            } finally {
                // إعادة تشغيل الكاميرا بعد 3 ثواني
                setTimeout(() => {
                    html5QrcodeScanner.resume();
                    resultDiv.innerHTML = "جاهز للمسح...";
                }, 3000);
            }
        }

        // ==========================================
        // 4. عرض النتائج
        // ==========================================
        function showSuccess(data, qrCode) {
            const feeText = data.fee_status === 'paid' ? 'مدفوع ✅' : 'غير مدفوع ❌';
            
            // تجهيز رسالة الواتساب
            const phone = data.parent_phone ? data.parent_phone.replace(/\D/g, '') : '';
            const whatsappText = encodeURIComponent(
                `عزيزي ولي الأمر،\n` +
                `تم تسجيل حضور الطالب: ${data.name} اليوم.\n` +
                `الحصص المتبقية: ${data.remaining}\n` +
                `حالة الاشتراك: ${feeText}`
            );
            
            let html = `
                <div class="success-box">
                    <h3 style="margin-top:0;">✅ تم تسجيل الحضور</h3>
                    <div class="info-row"><span>الطالب:</span> <strong>${data.name}</strong></div>
                    <div class="info-row"><span>الحصص المتبقية:</span> <strong>${data.remaining}</strong></div>
                    <div class="info-row"><span>حالة الرسوم:</span> <strong>${feeText}</strong></div>
            `;

            if (phone) {
                html += `
                    <a href="https://wa.me/${phone}?text=${whatsappText}" target="_blank" class="whatsapp-btn">
                        📲 إرسال رسالة لولي الأمر
                    </a>
                `;
            } else {
                html += `<p style="color:#d32f2f; font-size:14px; margin-top:10px;">لا يوجد رقم واتساب مسجل</p>`;
            }

            html += `</div>`;
            resultDiv.innerHTML = html;
        }

        function showError(message) {
            resultDiv.innerHTML = `
                <div class="error-box">
                    <h3 style="margin-top:0;">⚠️ تنبيه</h3>
                    <p>${message}</p>
                </div>
            `;
        }
    </script>
    <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
</body>
</html>
