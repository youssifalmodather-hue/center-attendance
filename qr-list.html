<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كروت QR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style> 
        body { font-family: 'Cairo', sans-serif; background-color: #f3f4f6; padding-bottom: 85px; } 
        
        /* تنسيقات خاصة بالطباعة */
        @media print {
            /* إخفاء كل حاجة في الصفحة */
            body * { visibility: hidden; }
            
            /* إظهار الكارت بس هو وكل اللي جواه */
            #cardArea, #cardArea * { visibility: visible; }
            
            /* تثبيت الكارت في مكانه على الورقة */
            #cardArea {
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                width: 100%;
                max-width: 400px;
                margin: 0;
                padding: 30px;
                box-shadow: none !important;
                border: 2px dashed #333 !important;
                border-radius: 15px;
            }

            /* إخفاء الأزرار وشريط التنقل */
            .no-print { display: none !important; }
            
            /* إظهار الـ QR بحجم مناسب للطباعة */
            #qrcode img { width: 250px !important; height: 250px !important; }
        }
    </style>
</head>
<body class="min-h-screen p-4">
    <div class="max-w-4xl mx-auto mt-4">
        <!-- شريط العنوان -->
        <div class="bg-white p-4 rounded-2xl shadow-sm mb-6 no-print">
            <h1 class="text-2xl font-extrabold text-gray-800">كروت QR</h1>
            <p class="text-gray-500 text-sm">اختر الطالب لعرض كارت الحضور وطباعته</p>
        </div>

        <!-- البحث واختيار الطالب -->
        <div class="bg-white p-4 rounded-2xl shadow-sm mb-6 no-print">
            <input type="text" id="searchInput" placeholder="ابحث بالاسم أو كود الطالب..." class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 mb-3 focus:ring-2 focus:ring-blue-500" oninput="filterStudents()">
            <div id="studentsListContainer" class="grid grid-cols-1 md:grid-cols-2 gap-2 max-h-60 overflow-y-auto">
                <!-- الطلاب هيظهروا هنا -->
            </div>
        </div>

        <!-- منطقة الكارت -->
        <div id="cardArea" class="hidden bg-white rounded-3xl shadow-xl max-w-sm mx-auto p-8 text-center border-t-8 border-blue-600">
            <h2 class="text-3xl font-extrabold text-blue-900 mb-1">السنتر</h2>
            <p class="text-gray-500 mb-6 font-semibold text-sm">كارت حضور الطالب</p>
            <div id="qrcode" class="mb-4 flex justify-center"></div>
            <h3 id="cardName" class="text-2xl font-bold text-gray-800 border-t pt-4">اسم الطالب</h3>
            <p class="text-xs text-gray-400 mt-2">يرجى إظهار الكارت عند الدخول</p>
        </div>

        <!-- أزرار الإجراءات (طباعة وواتساب) -->
        <div class="text-center mt-6 hidden no-print" id="actionButtonsContainer">
            <button onclick="window.print()" class="w-full max-w-xs mx-auto bg-gray-800 text-white font-bold py-3 px-8 rounded-xl shadow-lg hover:bg-gray-900 transition-colors flex items-center justify-center gap-2 mb-3">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                طباعة الكارت
            </button>
            
            <div id="whatsappBtnContainer" class="w-full max-w-xs mx-auto">
                <!-- زرار الواتساب هيتحط هنا -->
            </div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <nav id="bottomNav" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg z-50 transition-transform duration-300">
         <div class="max-w-md mx-auto flex justify-around">
            <!-- زرار إخفاء/إظهار الشريط (ثابت في مكانه) -->
<button onclick="toggleNav()" id="toggleNavBtn" class="fixed bottom-[80px] left-4 bg-gray-800 text-white p-2 rounded-full shadow-lg z-50 transition-all duration-300">
    <svg id="toggleIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <!-- سهم لتحت (عشان يخفي) -->
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
    </svg>
</button>
             <a href="index.html" class="flex flex-col items-center py-3 text-gray-500 hover:text-blue-600">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-xs">الرئيسية</span>
            </a>
            <a href="all-students.html" class="flex flex-col items-center py-3 text-gray-500 hover:text-blue-600">
                 <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <span class="text-xs">كل الطلاب</span>
            </a>
        </div>
    </nav>

    <script>
        const SUPABASE_URL = 'https://rhvqwqlceskxfmimycff.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_NMH3fk1qPBypFpji_aryxA_WTfePxTL';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let allStudents = [];

        // التحقق من تسجيل الدخول
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (!session) window.location.href = 'login.html';
            else loadStudents();
        });

        // جلب الطلاب من الداتابيز
        async function loadStudents() {
            const { data: students } = await supabaseClient.from('students')
                .select('id, name, qr_code, parent_phone')
                .order('name');
            
            allStudents = students || [];
            renderList(allStudents);
        }

        // عرض قائمة الطلاب للاختيار
        function renderList(students) {
            const container = document.getElementById('studentsListContainer');
            if (students.length === 0) {
                container.innerHTML = `<p class="text-gray-500 col-span-2 text-center py-4">لا يوجد طلاب</p>`;
                return;
            }
            container.innerHTML = students.map(s => `
                <button onclick="generateCard('${s.qr_code}', '${s.name}', '${s.parent_phone || ''}')" class="text-right bg-gray-50 hover:bg-blue-50 border border-gray-200 rounded-lg p-3 transition-colors">
                    <p class="font-bold text-gray-800 text-sm">${s.name}</p>
                    <p class="text-xs text-gray-500 font-mono">${s.qr_code}</p>
                </button>
            `).join('');
        }

        // البحث
        function filterStudents() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allStudents.filter(s => 
                s.name.toLowerCase().includes(q) || 
                s.qr_code.toLowerCase().includes(q)
            );
            renderList(filtered);
        }

        // توليد الكارت وعرضه
        function generateCard(qrCode, name, phone) {
            document.getElementById('cardName').innerText = name;
            document.getElementById('qrcode').innerHTML = "";
            
            // توليد الـ QR
            new QRCode(document.getElementById("qrcode"), {
                text: qrCode, 
                width: 180, 
                height: 180, 
                colorDark : "#000000", 
                colorLight : "#ffffff", 
                correctLevel : QRCode.CorrectLevel.H
            });

            // إظهار الكارت والأزرار
            document.getElementById('cardArea').classList.remove('hidden');
            document.getElementById('actionButtonsContainer').classList.remove('hidden');

            // تجهيز زرار الواتساب
            const whatsappBtnContainer = document.getElementById('whatsappBtnContainer');
            const cleanPhone = phone ? phone.replace(/\D/g, '') : '';
            
            if (cleanPhone) {
                const waText = encodeURIComponent(
                    `عزيزي ولي الأمر،\n` +
                    `تم تسجيل الطالب: ${name} بنجاح.\n` +
                    `هذا هو كود الحضور الخاص به: ${qrCode}\n` +
                    `يرجى الاحتفاظ بهذا الكود وإظهاره عند الدخول للسنتر.`
                );
                
                whatsappBtnContainer.innerHTML = `
                    <a href="https://wa.me/${cleanPhone}?text=${waText}" target="_blank" class="w-full bg-[#25D366] hover:bg-[#1ebe57] text-white font-bold py-3 px-6 rounded-xl shadow-lg flex items-center justify-center gap-2 transition-colors">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.885-9.885 9.885m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L0 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                        إرسال الكود لولي الأمر
                    </a>
                `;
            } else {
                whatsappBtnContainer.innerHTML = `<p class="text-xs text-red-500 mt-2 font-bold bg-red-50 p-2 rounded-lg">لا يوجد رقم واتساب مسجل لهذا الطالب</p>`;
            }
        }
                function toggleNav() {
            const nav = document.getElementById('bottomNav');
            const icon = document.getElementById('toggleIcon');

            if (nav.style.transform === 'translateY(100%)') {
                // إظهار الشريط
                nav.style.transform = 'translateY(0)';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>'; // سهم لتحت
            } else {
                // إخفاء الشريط
                nav.style.transform = 'translateY(100%)';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>'; // سهم لفوق
            }
        }
    </script>
</body>
</html>
