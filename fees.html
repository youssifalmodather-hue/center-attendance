<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرسوم والباقات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; background-color: #f3f4f6; padding-bottom: 85px; } </style>
</head>
<body class="min-h-screen p-4">
    <div class="max-w-4xl mx-auto mt-4">
        <!-- Header -->
        <div class="bg-white p-4 rounded-2xl shadow-sm mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-extrabold text-gray-800">الرسوم والباقات</h1>
                <p class="text-gray-500 text-sm">متابعة المدفوعات وتجديد الحصص</p>
            </div>
            <button onclick="loadFees()" class="bg-blue-50 text-blue-600 p-2.5 rounded-xl font-bold text-sm shadow-sm hover:bg-blue-100 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                تحديث
            </button>
        </div>

        <!-- أدوات الفلترة والبحث -->
        <div class="bg-white p-3 rounded-2xl shadow-sm mb-4 flex flex-col md:flex-row gap-3">
            <input type="text" id="searchInput" placeholder="ابحث باسم الطالب..." class="flex-1 bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500" oninput="renderTable()">
            
            <select id="groupFilter" class="flex-1 bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm font-bold focus:ring-2 focus:ring-blue-500" onchange="renderTable()">
                <option value="all">كل المجموعات</option>
                <!-- المجموعات هتتحمل هنا -->
            </select>
        </div>

        <!-- الجدول -->
        <div class="bg-white rounded-3xl shadow-lg overflow-hidden">
            <div class="p-0 overflow-x-auto">
                <table class="w-full text-right text-sm text-gray-600">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-50 sticky top-0">
                        <tr>
                            <th class="px-4 py-4">الطالب</th>
                            <th class="px-4 py-4">المجموعة</th>
                            <th class="px-4 py-4">الحصص المتبقية</th>
                            <th class="px-4 py-4">حالة الدفع</th>
                            <th class="px-4 py-4 text-center">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="feesList"><tr><td colspan="5" class="text-center py-6 text-gray-400">جاري التحميل...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal لتجديد الحصص/الدفع -->
    <div id="paymentModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm">
            <h2 class="text-xl font-bold mb-4 text-center">تجديد/دفع اشتراك</h2>
            <input type="hidden" id="payStudentId">
            <div class="mb-3">
                <label class="block text-sm font-bold text-gray-700 mb-1">عدد الحصص</label>
                <input type="number" id="payLessons" value="8" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-bold text-gray-700 mb-1">المبلغ المدفوع</label>
                <input type="number" id="payAmount" placeholder="اختياري" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3">
            </div>
            <div class="flex gap-2">
                <button onclick="submitPayment()" class="flex-1 bg-green-600 text-white py-2.5 rounded-xl font-bold">حفظ الدفع</button>
                <button onclick="closeModal()" class="flex-1 bg-gray-200 text-gray-800 py-2.5 rounded-xl font-bold">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <nav id="bottomNav" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg z-50 transition-transform duration-300">
        <div class="max-w-md mx-auto flex justify-around">
            <!-- زرار إخفاء/إظهار الشريط (ثابت في مكانه) -->
<button onclick="toggleNav()" id="toggleNavBtn" class="fixed bottom-[80px] left-4 bg-gray-800 text-white p-2 rounded-full shadow-lg z-50 transition-all duration-300">
    <svg id="toggleIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <!-- سهم لتحت (عشان يخفي) -->
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
    </svg>
</button>
            <a href="index.html" class="flex flex-col items-center py-3 text-gray-500 hover:text-blue-600">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-xs">الرئيسية</span>
            </a>
            <a href="all-students.html" class="flex flex-col items-center py-3 text-gray-500 hover:text-blue-600">
                 <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <span class="text-xs">كل الطلاب</span>
            </a>
            <a href="groups.html" class="flex flex-col items-center py-3 text-blue-600 font-bold">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span class="text-xs">المجموعات</span>
            </a>
        </div>
    </nav>

    <script>
        const SUPABASE_URL = 'https://rhvqwqlceskxfmimycff.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_NMH3fk1qPBypFpji_aryxA_WTfePxTL';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allStudentsData = []; // عشان نخزن الداتا ونفلترها بدون ما نرجع للداتابيز كل شوية

        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (!session) window.location.href = 'login.html';
            else {
                loadGroups();
                loadFees();
            }
        });

        // تحميل المجموعات في القائمة المنسدلة
        async function loadGroups() {
            const { data: groups } = await supabaseClient.from('groups').select('id, name').order('name');
            const select = document.getElementById('groupFilter');
            groups?.forEach(g => {
                select.innerHTML += `<option value="${g.id}">${g.name}</option>`;
            });
        }

        function closeModal() { document.getElementById('paymentModal').classList.add('hidden'); document.getElementById('paymentModal').classList.remove('flex'); }
        function openModal(id) { document.getElementById('payStudentId').value = id; document.getElementById('paymentModal').classList.remove('hidden'); document.getElementById('paymentModal').classList.add('flex'); }

        async function loadFees() {
            const { data: students } = await supabaseClient.from('students')
                .select(`id, name, parent_phone, group_id, groups(name), course_package(total_lessons, used_lessons, expire_at), payments(id, status)`)
                .order('name');
            
            if (!students) {
                document.getElementById('feesList').innerHTML = `<tr><td colspan="5" class="text-center py-6 text-gray-500">لا يوجد طلاب</td></tr>`;
                return;
            }
            
            allStudentsData = students;
            renderTable();
        }

        // دالة عرض الجدول بناءً على الفلتر والبحث
        function renderTable() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const selectedGroup = document.getElementById('groupFilter').value;
            
            let filteredData = allStudentsData;

            // فلترة بالمجموعة
            if (selectedGroup !== 'all') {
                filteredData = filteredData.filter(s => s.group_id == selectedGroup);
            }

            // فلترة بالبحث
            if (searchText) {
                filteredData = filteredData.filter(s => s.name.toLowerCase().includes(searchText));
            }

            const tbody = document.getElementById('feesList');
            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-gray-500">لا يوجد طلاب مطابقين للبحث</td></tr>`;
                return;
            }

            tbody.innerHTML = filteredData.map(s => {
                const pkg = s.course_package?.sort((a,b)=> new Date(b.expire_at) - new Date(a.expire_at))[0];
                const payment = s.payments?.sort((a,b)=> b.id - a.id)[0];
                
                let remaining = 0, expireMsg = 'لا يوجد باقة';
                if (pkg) {
                    remaining = pkg.total_lessons - pkg.used_lessons;
                    expireMsg = remaining <= 0 ? 'انتهت' : `${remaining} حصة`;
                }

                const isPaid = payment?.status === 'paid';
                const feeBadge = isPaid 
                    ? `<button onclick="togglePayment(${s.id}, 'unpaid')" class="bg-green-100 text-green-700 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-green-200 transition-colors">مدفوع ✅</button>` 
                    : `<button onclick="togglePayment(${s.id}, 'paid')" class="bg-red-100 text-red-700 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-red-200 transition-colors">غير مدفوع ❌</button>`;
                
                const phone = s.parent_phone?.replace(/\D/g, '') || '';
                const waText = encodeURIComponent(`عزيزي ولي الأمر،\nنود تذكيركم بسداد رسوم الحصص الخاصة بالطالب: ${s.name}.\nشاكرين تعاونكم.`);
                const waBtn = phone && !isPaid ? `<a href="https://wa.me/${phone}?text=${waText}" target="_blank" class="p-2 bg-[#25D366] text-white rounded-lg" title="مراسلة واتساب"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.885-9.885 9.885m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L0 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg></a>` : '';

                return `<tr class="border-b hover:bg-gray-50">
                    <td class="px-4 py-4 font-bold text-blue-600 hover:underline cursor-pointer" onclick="window.location.href='student-report.html?id=${s.id}'">${s.name}</td>
                    <td class="px-4 py-4 text-gray-500 text-xs">${s.groups?.name || 'بدون'}</td>
                    <td class="px-4 py-4"><span class="font-bold ${remaining > 0 ? 'text-blue-600' : 'text-red-600'}">${expireMsg}</span></td>
                    <td class="px-4 py-4">${feeBadge}</td>
                    <td class="px-4 py-4 flex justify-center gap-1">
                        ${waBtn}
                        <button onclick="openModal(${s.id})" class="p-2 bg-blue-50 text-blue-600 rounded-lg" title="دفع/تجديد"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg></button>
                    </td>
                </tr>`;
            }).join('');
        }

        // دالة تعديل حالة الدفع
        async function togglePayment(studentId, newStatus) {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            const { error } = await supabaseClient.from('payments').insert({
                student_id: studentId,
                amount: newStatus === 'paid' ? 300 : 0,
                status: newStatus,
                paid_at: newStatus === 'paid' ? new Date().toISOString() : null,
                user_id: session.user.id
            });

            if (error) return alert('خطأ: ' + error.message);
            loadFees(); // تحديث الجدول
        }

        // دالة تجديد الباقة
        async function submitPayment() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const studentId = document.getElementById('payStudentId').value;
            const lessons = parseInt(document.getElementById('payLessons').value) || 0;
            const amount = parseFloat(document.getElementById('payAmount').value) || 0;

            if (lessons <= 0) return alert('أدخل عدد حصص صحيح');

            await supabaseClient.from('payments').insert({
                student_id: studentId, amount: amount, status: 'paid', paid_at: new Date().toISOString(), user_id: session.user.id
            });

            const expire = new Date(); expire.setFullYear(expire.getFullYear() + 1);
            await supabaseClient.from('course_package').insert({
                student_id: studentId, total_lessons: lessons, used_lessons: 0, expire_at: expire.toISOString(), user_id: session.user.id
            });

            closeModal();
            loadFees();
            alert('تم تسجيل الدفع وتجديد الباقة بنجاح');
        }
                function toggleNav() {
            const nav = document.getElementById('bottomNav');
            const icon = document.getElementById('toggleIcon');

            if (nav.style.transform === 'translateY(100%)') {
                // إظهار الشريط
                nav.style.transform = 'translateY(0)';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>'; // سهم لتحت
            } else {
                // إخفاء الشريط
                nav.style.transform = 'translateY(100%)';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>'; // سهم لفوق
            }
        }
    </script>
</body>
</html>
