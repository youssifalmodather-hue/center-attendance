<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بروفايل الطالب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; background-color: #f3f4f6; padding-bottom: 85px; } </style>
</head>
<body class="min-h-screen p-4">
    <div class="max-w-4xl mx-auto mt-4">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-sm">
            <a href="javascript:history.back()" class="text-blue-600 font-bold flex items-center gap-1">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                رجوع
            </a>
            <h1 id="studentName" class="text-2xl font-extrabold text-gray-800 text-center">جاري التحميل...</h1>
             <a href="qr-list.html" class="bg-gray-100 text-gray-600 px-3 py-1.5 rounded-lg text-sm font-bold hover:bg-gray-200">QR</a>
    <button onclick="deleteStudent()" class="bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-sm font-bold hover:bg-red-200">مسح</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <!-- بيانات الطالب -->
            <div class="bg-white rounded-3xl shadow-lg p-6">
                <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">بيانات الطالب</h2>
                <p class="mb-2"><span class="font-bold text-gray-500">المجموعة:</span> <span id="studentGroup" class="font-bold text-gray-800"></span></p>
                <p class="mb-2"><span class="font-bold text-gray-500">واتساب:</span> <span id="studentPhone" class="font-bold text-gray-800 dir-ltr text-right"></span></p>
                <p class="mb-2"><span class="font-bold text-gray-500">الحصص المتبقية:</span> <span id="studentRemaining" class="font-bold text-blue-600"></span></p>
                <p><span class="font-bold text-gray-500">حالة الدفع:</span> <span id="studentFee" class="font-bold"></span></p>
                <!-- في قسم بيانات الطالب، تحت حالة الدفع -->
<button onclick="markAbsent()" id="markAbsentBtn" class="mt-4 w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 rounded-xl text-sm transition-colors">تسجيل غياب اليوم</button>
            </div>

            <!-- أيام الغياب -->
            <div class="bg-white rounded-3xl shadow-lg p-6">
                <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">أيام الغياب</h2>
                <div id="absenceDates" class="space-y-2 max-h-48 overflow-y-auto text-sm text-gray-600">
                    جاري التحميل...
                </div>
            </div>
        </div>

        <!-- سجل الحضور (جدول جديد) -->
        <div class="bg-white rounded-3xl shadow-lg mb-6 overflow-hidden">
            <div class="bg-blue-600 p-4"><h2 class="text-white font-bold">سجل الحضور (التاريخ والساعة)</h2></div>
            <div class="p-0 overflow-x-auto max-h-64">
                <table class="w-full text-right text-sm text-gray-600">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-50 sticky top-0">
                        <tr>
                            <th class="px-4 py-3">التاريخ</th>
                            <th class="px-4 py-3">اليوم</th>
                            <th class="px-4 py-3">وقت الحضور</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceHistoryList">
                        <tr><td colspan="3" class="text-center py-4">جاري التحميل...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- الدرجات -->
        <div class="bg-white rounded-3xl shadow-lg overflow-hidden">
            <div class="bg-purple-600 p-4"><h2 class="text-white font-bold">درجات الامتحانات</h2></div>
            <div class="p-0 overflow-x-auto">
                <table class="w-full text-right text-sm text-gray-600">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-50">
                        <tr><th class="px-4 py-4">الامتحان</th><th class="px-4 py-4">الدرجة</th></tr>
                    </thead>
                    <tbody id="examResultsList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <nav id="bottomNav" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg z-50 transition-transform duration-300">
        <div class="max-w-md mx-auto flex justify-around">
            <!-- زرار إخفاء/إظهار الشريط (ثابت في مكانه) -->
<button onclick="toggleNav()" id="toggleNavBtn" class="fixed bottom-[80px] left-4 bg-gray-800 text-white p-2 rounded-full shadow-lg z-50 transition-all duration-300">
    <svg id="toggleIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <!-- سهم لتحت (عشان يخفي) -->
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
    </svg>
</button>
             <a href="index.html" class="flex flex-col items-center py-3 text-gray-500 hover:text-blue-600">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-xs">الرئيسية</span>
            </a>
            <a href="all-students.html" class="flex flex-col items-center py-3 text-blue-600 font-bold">
                 <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <span class="text-xs">كل الطلاب</span>
            </a>
        </div>
    </nav>

    <script>
        const SUPABASE_URL = 'https://rhvqwqlceskxfmimycff.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_NMH3fk1qPBypFpji_aryxA_WTfePxTL';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const studentId = urlParams.get('id');

        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (!session) window.location.href = 'login.html';
            else if (!studentId) window.location.href = 'all-students.html';
            else loadStudentProfile();
        });

        async function loadStudentProfile() {
            // 1. البيانات الأساسية
            const { data: student } = await supabaseClient.from('students')
                .select(`name, parent_phone, groups(name), course_package(total_lessons, used_lessons), payments(status)`)
                .eq('id', studentId).single();

            if (student) {
                document.getElementById('studentName').innerText = student.name;
                document.getElementById('studentGroup').innerText = student.groups?.name || 'بدون';
                document.getElementById('studentPhone').innerText = student.parent_phone || 'غير مسجل';
                
                const pkg = student.course_package?.sort((a,b)=> b.id - a.id)[0];
                const remaining = pkg ? (pkg.total_lessons - pkg.used_lessons) : 0;
                document.getElementById('studentRemaining').innerText = remaining + ' حصة';
                
                const feeEl = document.getElementById('studentFee');
                const isPaid = student.payments?.sort((a,b)=> b.id - a.id)[0]?.status === 'paid';
                feeEl.innerText = isPaid ? 'مدفوع ✅' : 'غير مدفوع ❌';
                feeEl.className = isPaid ? 'font-bold text-green-600' : 'font-bold text-red-600';
            }

            // 2. أيام الغياب
            const { data: absenceDates } = await supabaseClient.rpc('get_absence_dates', { p_student_id: studentId });
            const absenceDiv = document.getElementById('absenceDates');
            if (!absenceDates || absenceDates.length === 0) {
                absenceDiv.innerHTML = `<p class="text-green-600 font-bold">لا يوجد غياب</p>`;
            } else {
                absenceDiv.innerHTML = absenceDates.map(d => `
                    <div class="flex justify-between bg-red-50 text-red-700 p-2 rounded-lg mb-1">
                        <span>${d.date_of_absence}</span>
                        <span class="text-xs font-bold">غائب</span>
                    </div>
                `).join('');
            }

            // 3. سجل الحضور (التاريخ والوقت)
            const { data: attendanceHistory } = await supabaseClient.from('attendance_log')
                .select('session_date, scan_time')
                .eq('student_id', studentId)
                .eq('status', 'present') 
                .order('scan_time', { ascending: false });

            const historyTbody = document.getElementById('attendanceHistoryList');
            if (!attendanceHistory || attendanceHistory.length === 0) {
                historyTbody.innerHTML = `<tr><td colspan="3" class="text-center py-4 text-gray-500">لا يوجد سجل حضور</td></tr>`;
            } else {
                historyTbody.innerHTML = attendanceHistory.map(log => {
                    const dateObj = new Date(log.scan_time);
                    const dateStr = dateObj.toLocaleDateString('ar-EG', { year: 'numeric', month: '2-digit', day: '2-digit' });
                    const dayStr = dateObj.toLocaleDateString('ar-EG', { weekday: 'long' });
                    const timeStr = dateObj.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
                    
                    return `<tr class="border-b hover:bg-gray-50">
                        <td class="px-4 py-3 font-bold text-gray-800">${dateStr}</td>
                        <td class="px-4 py-3 text-gray-500">${dayStr}</td>
                        <td class="px-4 py-3"><span class="bg-green-50 text-green-700 px-2 py-1 rounded font-bold text-xs">${timeStr}</span></td>
                    </tr>`;
                }).join('');
            }

            // 4. الدرجات
            const { data: results } = await supabaseClient.from('exam_results')
                .select(`score, exams(title, max_score)`)
                .eq('student_id', studentId);
            
            const resTbody = document.getElementById('examResultsList');
            if (!results || results.length === 0) {
                resTbody.innerHTML = `<tr><td colspan="2" class="text-center py-4 text-gray-500">لا توجد درجات</td></tr>`;
            } else {
                resTbody.innerHTML = results.map(r => {
                    const pct = (r.score / r.exams.max_score) * 100;
                    const col = pct >= 50 ? 'text-green-600' : 'text-red-600';
                    return `<tr class="border-b">
                        <td class="px-4 py-3 font-bold text-gray-800">${r.exams.title}</td>
                        <td class="px-4 py-3 font-bold ${col}">${r.score} / ${r.exams.max_score}</td>
                    </tr>`;
                }).join('');
            }
        }
                function toggleNav() {
            const nav = document.getElementById('bottomNav');
            const icon = document.getElementById('toggleIcon');

            if (nav.style.transform === 'translateY(100%)') {
                // إظهار الشريط
                nav.style.transform = 'translateY(0)';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>'; // سهم لتحت
            } else {
                // إخفاء الشريط
                nav.style.transform = 'translateY(100%)';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>'; // سهم لفوق
            }
        }
                        async function markAbsent() {
            if (!confirm('هل أنت متأكد من تسجيل غياب هذا الطالب اليوم؟')) return;
            
            const { data, error } = await supabaseClient.rpc('mark_absent', { p_student_id: studentId });
            
            if (error) return alert('خطأ: ' + error.message);
            if (data.status === 'error') return alert(data.message);
            
            alert('تم تسجيل الغياب بنجاح');
            location.reload();
        }
                async function deleteStudent() {
            // تأكيد أول وثاني عشان نتأكد إن الموظف مش داس بالغلط
            if (!confirm('هل أنت متأكد من مسح هذا الطالب نهائياً؟ سيتم مسح كل سجلات الحضور والدرجات والمدفوعات الخاصة به.')) return;
            if (!confirm('تحذير أخير: هذا الإجراء لا يمكن التراجع عنه. هل أنت متأكد؟')) return;
            
            // مسح الطالب
            const { error } = await supabaseClient.from('students').delete().eq('id', studentId);
            
            if (error) {
                alert('حدث خطأ أثناء المسح: ' + error.message);
            } else {
                alert('تم مسح الطالب وكل بياناته بنجاح.');
                window.location.href = 'all-students.html'; // العودة لصفحة كل الطلاب
            }
        }
    </script>
</body>
</html>
