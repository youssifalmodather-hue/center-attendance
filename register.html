<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #064e3b 0%, #10b981 100%); } </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8">
        <div class="text-center mb-8">
            <div class="bg-gradient-to-br from-green-500 to-green-700 w-20 h-20 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
            </div>
            <h1 class="text-3xl font-extrabold text-gray-800">حساب جديد</h1>
        </div>
        <form id="registerForm" class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">البريد الإلكتروني</label>
                <input type="email" id="email" required class="w-full bg-gray-50 border-2 border-gray-200 rounded-xl p-3.5">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">كلمة المرور</label>
                <input type="password" id="password" required minlength="6" class="w-full bg-gray-50 border-2 border-gray-200 rounded-xl p-3.5">
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-green-600 to-green-800 text-white font-bold py-3.5 rounded-xl shadow-lg">إنشاء الحساب</button>
        </form>
        <div class="mt-6 text-center border-t pt-4">
            <a href="login.html" class="text-green-600 font-bold text-sm hover:underline">لديك حساب؟ سجل الدخول</a>
        </div>
        <div id="msg" class="mt-4 text-center font-bold hidden p-3 rounded-xl"></div>
    </div>
    <script>
        const SUPABASE_URL = 'https://rhvqwqlceskxfmimycff.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_NMH3fk1qPBypFpji_aryxA_WTfePxTL';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('msg');
            btn.innerText = 'جاري الإنشاء...'; btn.disabled = true;
            const { error } = await supabaseClient.auth.signUp({
                email: document.getElementById('email').value, password: document.getElementById('password').value
            });
            if (error) { msg.innerText = 'خطأ: ' + error.message; msg.className = 'mt-4 text-center text-red-600 font-bold bg-red-50 p-3 rounded-xl'; msg.classList.remove('hidden'); btn.innerText = 'إنشاء الحساب'; btn.disabled = false; } 
            else {
                msg.innerText = 'تم إنشاء الحساب!'; msg.className = 'mt-4 text-center text-green-600 font-bold bg-green-50 p-3 rounded-xl'; msg.classList.remove('hidden');
                setTimeout(() => window.location.href = 'login.html', 2000);
            }
        });
    </script>
</body>
</html>
