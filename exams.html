<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة امتحان ودرجات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; background-color: #f3f4f6; padding-bottom: 85px; } </style>
</head>
<body class="min-h-screen p-4">
    <div class="max-w-4xl mx-auto mt-4">
        <div class="bg-white p-4 rounded-2xl shadow-sm mb-6">
            <h1 class="text-2xl font-extrabold text-gray-800">إضافة درجات</h1>
            <p class="text-gray-500 text-sm">سجل الامتحان وأدخل درجات الطلاب</p>
        </div>

        <div class="bg-white rounded-2xl shadow-sm p-4 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">عنوان الامتحان</label>
                    <input type="text" id="examTitle" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2 text-sm" placeholder="امتحان الشهر الأول">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">المجموعة</label>
                    <select id="examGroup" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2 text-sm"></select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">الدرجة النهائية</label>
                    <input type="number" id="examMax" value="50" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2 text-sm">
                </div>
            </div>
            <button onclick="createExam()" class="bg-purple-600 text-white px-6 py-2 rounded-lg font-bold text-sm w-full md:w-auto">إنشاء الامتحان</button>
        </div>

        <div id="scoreSection" class="hidden bg-white rounded-2xl shadow-sm p-4">
            <h2 id="examHeader" class="text-lg font-bold text-gray-800 mb-4"></h2>
            <div id="studentsScores" class="space-y-2"></div>
            <button onclick="saveScores()" class="mt-4 bg-green-600 text-white px-6 py-2 rounded-lg font-bold text-sm w-full">حفظ الدرجات وإرسال إشعارات</button>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg z-50">
        <div class="max-w-md mx-auto flex justify-around">
            <a href="index.html" class="flex flex-col items-center py-3 text-gray-500 hover:text-blue-600">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-xs">الرئيسية</span>
            </a>
            <a href="scan.html" class="flex flex-col items-center py-3 text-gray-500 hover:text-blue-600">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
                <span class="text-xs">المسح</span>
            </a>
            <a href="groups.html" class="flex flex-col items-center py-3 text-blue-600 font-bold">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span class="text-xs">المجموعات</span>
            </a>
        </div>
    </nav>

    <script>
        const SUPABASE_URL = 'https://rhvqwqlceskxfmimycff.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_NMH3fk1qPBypFpji_aryxA_WTfePxTL';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentExamId = null;
        let currentStudents = [];

        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (!session) window.location.href = 'login.html';
            else loadGroups();
        });

        async function loadGroups() {
            const { data: groups } = await supabaseClient.from('groups').select('*');
            const select = document.getElementById('examGroup');
            groups?.forEach(g => select.innerHTML += `<option value="${g.id}">${g.name}</option>`);
        }

        async function createExam() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const title = document.getElementById('examTitle').value;
            const groupId = document.getElementById('examGroup').value;
            const max = parseFloat(document.getElementById('examMax').value);

            if (!title || !groupId) return alert('أدخل البيانات كاملة');

            const { data: exam, error } = await supabaseClient.from('exams').insert({
                title, group_id: groupId, max_score: max, user_id: session.user.id
            }).select().single();

            if (error) return alert('خطأ: ' + error.message);
            currentExamId = exam.id;

            const { data: students } = await supabaseClient.from('students').select('id, name').eq('group_id', groupId);
            currentStudents = students || [];

            document.getElementById('examHeader').innerText = `${title} (من ${max})`;
            const container = document.getElementById('studentsScores');
            container.innerHTML = currentStudents.map(s => `
                <div class="flex items-center gap-2 bg-gray-50 p-2 rounded-lg">
                    <span class="flex-1 font-bold text-sm">${s.name}</span>
                    <input type="number" id="score_${s.id}" placeholder="الدرجة" max="${max}" class="w-24 bg-white border border-gray-200 rounded-lg p-2 text-sm text-center">
                </div>
            `).join('');

            document.getElementById('scoreSection').classList.remove('hidden');
        }

        async function saveScores() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const records = [];

            for (const s of currentStudents) {
                const val = parseFloat(document.getElementById(`score_${s.id}`).value);
                if (!isNaN(val)) {
                    records.push({ exam_id: currentExamId, student_id: s.id, score: val, user_id: session.user.id });
                }
            }

            if (records.length === 0) return alert('لم تدخل أي درجات');

            const { error } = await supabaseClient.from('exam_results').insert(records);
            if (error) return alert('خطأ: ' + error.message);

            alert('تم حفظ الدرجات بنجاح!');
            window.location.href = 'results-report.html';
        }
    </script>
</body>
</html>
